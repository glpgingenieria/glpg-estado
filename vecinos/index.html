<style>
  :root{
    --naranja:#F0561E; --azul:#123A6B; --azul2:#1c4f8f;
    --gris:#f4f5f7; --gris2:#e7e9ee; --texto:#243040; --muted:#6b7686;
    --ok:#1f9d55; --warn:#c47f00; --bad:#c0392b;
    --radio:14px; --sombra:0 6px 24px rgba(18,58,107,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--gris);color:var(--texto);}
  .topbar{background:#fff;border-bottom:3px solid var(--naranja);
          padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{height:40px;width:auto;display:block}
  .logo b{color:var(--azul);font-size:18px;letter-spacing:.3px}
  .logo small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  .wrap{max-width:820px;margin:0 auto;padding:22px 16px 60px}
  .card{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:22px;margin-bottom:16px}

  /* Login */
  .login{max-width:420px;margin:8vh auto 0}
  .login h1{color:var(--azul);font-size:22px;margin:0 0 4px}
  .login p{color:var(--muted);margin:0 0 20px;font-size:14px;line-height:1.5;text-align:center}
  label{display:block;font-size:13px;font-weight:700;color:var(--azul);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;border:1.5px solid var(--gris2);border-radius:10px;
        font-size:16px;outline:none;transition:border .15s}
  input:focus{border-color:var(--naranja)}
  .btn{background:var(--naranja);color:#fff;border:none;border-radius:11px;
       padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:18px;
       transition:filter .15s}
  .btn:hover{filter:brightness(.95)}
  .btn.sec{background:#fff;color:var(--azul);border:1.5px solid var(--gris2);width:auto;margin:0}
  .btn.sec:hover{border-color:var(--azul)}
  .hint{background:#fff7f3;border:1px dashed var(--naranja);border-radius:10px;
        padding:10px 12px;font-size:12.5px;color:#8a3d1e;margin-top:16px;line-height:1.6}
  .err{color:var(--bad);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}

  /* Ficha */
  .ficha-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
  .ficha-head h2{margin:0;color:var(--azul);font-size:20px}
  .ficha-head .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
        padding:6px 11px;border-radius:999px}
  .chip.ok{background:#e7f6ee;color:var(--ok)}
  .chip.warn{background:#fdf3e0;color:var(--warn)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px}
  .kpi{background:var(--gris);border-radius:12px;padding:14px}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:20px;font-weight:800;color:var(--azul);margin-top:4px}
  .kpi.sal .val{color:var(--naranja)}
  .bar{height:12px;background:var(--gris2);border-radius:999px;overflow:hidden;margin:16px 0 6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--naranja),#ff7a47)}
  .bar-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
  .tc-note{font-size:12px;color:var(--muted);margin-top:6px}

  h3.sec-t{color:var(--azul);font-size:15px;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
  h3.sec-t::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--naranja)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--gris2)}
  th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .imp{font-size:12px;color:var(--muted)}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .tag.mat{background:#eaf1fb;color:var(--azul2)}
  .tag.mo{background:#fbeeea;color:var(--naranja)}
  .recibo-btn{background:#fff;border:1.5px solid var(--gris2);color:var(--azul);
        border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
  .recibo-btn:hover{border-color:var(--naranja);color:var(--naranja)}
  .explica{background:#f0f5fb;border-left:4px solid var(--azul2);border-radius:8px;
        padding:12px 14px;font-size:13px;color:#3a4a5e;line-height:1.6;margin-top:14px}
  .foot{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:18px;text-align:center}
  .table-scroll{overflow-x:auto}
  @media(max-width:560px){.grid3{grid-template-columns:1fr}}
  .hidden{display:none!important}
  .selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tabc{background:#fff;border:1.5px solid var(--gris2);color:var(--azul);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .tabc.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .est{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .est.ok{background:#e7f6ee;color:#1f9d55}
  .est.par{background:#fdf3e0;color:#c47f00}
  .est.pen{background:#f4f5f7;color:#6b7686}
</style>
</head>

const LOGO_ISO_ASPECT = 0.8375;
const D = window.GLPG_DATA || {registros:[],tc:0,site_salt:""};
const TC_DIA = D.tc;
let persona=null, cuentaIdx=0;

const fmtARS = n => "$ " + Math.round(n).toLocaleString("es-AR");
const fmtUSD = n => "US$ " + (Math.round(n*100)/100).toLocaleString("es-AR");
const fmtFecha = s => { if(!s) return "—"; const a=s.split("-"); return a[2]+"/"+a[1]+"/"+a[0]; };
const normDni = s => (s||"").replace(/[^0-9]/g,"");
const sha16 = s => CryptoJS.SHA256(s).toString(CryptoJS.enc.Hex).slice(0,16);

function decode(dni,pin){
  const rec = D.registros.find(r=>r.h===sha16(D.site_salt+"|"+dni));
  if(!rec) return null;
  try{
    const key=CryptoJS.PBKDF2(dni+"|"+pin, CryptoJS.enc.Base64.parse(rec.s),
        {keySize:256/32, iterations:rec.it, hasher:CryptoJS.algo.SHA256});
    const dec=CryptoJS.AES.decrypt({ciphertext:CryptoJS.enc.Base64.parse(rec.ct)}, key,
        {iv:CryptoJS.enc.Base64.parse(rec.iv), mode:CryptoJS.mode.CBC, padding:CryptoJS.pad.Pkcs7});
    const txt=dec.toString(CryptoJS.enc.Utf8);
    if(!txt) return null;
    const o=JSON.parse(txt);
    return o.dni===dni ? o : null;
  }catch(e){ return null; }
}
function entrar(){
  const dni=normDni(document.getElementById("dni").value);
  const pin=document.getElementById("pin").value.trim();
  const err=document.getElementById("loginErr");
  if(!dni||!pin){ err.textContent="Completá tu DNI y tu PIN."; return; }
  const p=decode(dni,pin);
  if(!p){ err.textContent="DNI o PIN incorrecto. Revisá el mensaje que te enviamos."; return; }
  err.textContent=""; persona=p; cuentaIdx=0; renderPersona();
}
function salir(){
  persona=null;
  document.getElementById("fichaView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
  document.getElementById("topRight").innerHTML="";
  document.getElementById("dni").value=""; document.getElementById("pin").value="";
}
function pickCuenta(i){ cuentaIdx=i; renderPersona(); }

function renderPersona(){
  const p=persona, f=p.cuentas[cuentaIdx], alDia=f.saldoARS<=1;
  let selector="";
  if(p.cuentas.length>1){
    selector='<div class="selector">'+p.cuentas.map(function(c,i){
      return '<button class="tabc '+(i===cuentaIdx?'on':'')+'" onclick="pickCuenta('+i+')">'+c.obra+' ('+c.id+')</button>';
    }).join("")+'</div>';
  }
  const filas=f.pagos.map(function(pg,i){
    const nativo=pg.mon==="USD"?fmtUSD(pg.m):fmtARS(pg.m);
    const eq=pg.mon==="USD"?'<div class="imp">≈ '+fmtARS(pg.ars)+(pg.tc?(' · TC '+pg.tc):' · TC del día')+'</div>':
             (pg.t==="mat"&&pg.tc?'<div class="imp">TC '+pg.tc+'</div>':"");
    return '<tr><td>'+fmtFecha(pg.f)+'</td>'
      +'<td><span class="tag '+pg.t+'">'+(pg.t==="mat"?"Materiales":"Mano de obra")+'</span>'
      +'<div class="imp">'+(pg.n?("Cuota "+pg.n):"Pago")+' · '+(pg.t==="mat"?"materiales (USD)":"mano de obra (ARS)")+'</div></td>'
      +'<td class="num">'+nativo+eq+'</td>'
      +'<td class="num"><button class="recibo-btn" onclick="recibo('+i+')">Recibo PDF</button></td></tr>';
  }).join("");
  const excHtml=f.exc>0?'<div class="kpi" style="background:#e7f6ee"><div class="lbl">A tu favor</div><div class="val" style="color:#1f9d55">'+fmtARS(f.exc)+'</div></div>':"";
  const usdNota=(f.pagUSD||f.salUSD)?'<div class="tc-note">Materiales (USD): pagado US$ '+f.pagUSD.toLocaleString("es-AR")+' · resta US$ '+f.salUSD.toLocaleString("es-AR")+'.</div>':"";
  const netoNota=f.exc>0?'<div class="tc-note">Deuda neta (saldo menos lo que tenés a favor): <b>'+fmtARS(f.neto)+'</b>.</div>':"";

  // detalle por cuota
  let cuotasCard;
  if(f.cuotas_ok && f.cuotas.length){
    const cf=f.cuotas.map(function(c){
      const monto=c.mon==="USD"?fmtUSD(c.aj):fmtARS(c.aj);
      const resta=c.mon==="USD"?fmtUSD(c.sal):fmtARS(c.sal);
      const pag=c.mon==="USD"?fmtUSD(c.pag):fmtARS(c.pag);
      const est=c.est==="Pagada"?'<span class="est ok">Pagada</span>':
                c.est==="Parcial"?'<span class="est par">Parcial</span>':'<span class="est pen">Pendiente</span>';
      return '<tr><td>'+(c.n!=null?c.n:"—")+'</td>'
        +'<td><span class="tag '+c.t+'">'+(c.t==="mat"?"Mat.":"M.O.")+'</span></td>'
        +'<td>'+fmtFecha(c.vto)+'</td>'
        +'<td class="num">'+monto+'</td><td class="num">'+pag+'</td><td class="num">'+resta+'</td>'
        +'<td>'+est+'</td></tr>';
    }).join("");
    cuotasCard='<div class="card"><h3 class="sec-t">Detalle por cuota</h3>'
      +'<div class="table-scroll"><table><thead><tr><th>Cuota</th><th>Tipo</th><th>Vence</th>'
      +'<th class="num">Monto</th><th class="num">Pagado</th><th class="num">Resta</th><th>Estado</th></tr></thead>'
      +'<tbody>'+cf+'</tbody></table></div>'
      +'<div class="tc-note">Materiales en dólares (US$), mano de obra en pesos ($). El monto de cada cuota ya incluye el ajuste por ICC cuando corresponde.</div></div>';
  }else{
    cuotasCard='<div class="card"><h3 class="sec-t">Detalle por cuota</h3>'
      +'<div class="explica">El detalle cuota por cuota de esta cuenta está <b>en revisión</b>. El <b>saldo de arriba es el válido</b>. Para el desglose, escribinos a administración.</div></div>';
  }

  const html=''
    +(selector)
    +'<div class="card"><div class="ficha-head">'
    +'<div><h2>'+p.nombre+'</h2><div class="meta">'+f.obra+' · Cliente '+f.id+'</div></div>'
    +'<span class="chip '+(alDia?'ok':'warn')+'">'+(alDia?'✓ Al día':'● Con saldo pendiente')+'</span></div>'
    +'<div class="grid3">'
    +'<div class="kpi"><div class="lbl">Total del plan</div><div class="val">'+fmtARS(f.planARS)+'</div></div>'
    +'<div class="kpi"><div class="lbl">Pagado</div><div class="val">'+fmtARS(f.pagARS)+'</div></div>'
    +'<div class="kpi sal"><div class="lbl">Saldo</div><div class="val">'+fmtARS(f.saldoARS)+'</div></div></div>'
    +(excHtml?('<div style="margin:10px 0">'+excHtml+'</div>'):"")
    +'<div class="bar-lbl"><span>Avance de pago</span><span>'+f.pct+'%</span></div>'
    +'<div class="bar"><i style="width:'+f.pct+'%"></i></div>'
    +'<div class="tc-note">Los valores en dólares (materiales) se muestran convertidos al TC del día: <b>$'+TC_DIA.toLocaleString("es-AR")+'</b>.</div>'
    +usdNota+netoNota+'</div>'
    +'<div class="card"><h3 class="sec-t">Tus pagos y a qué cuota se imputaron</h3>'
    +'<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Monto</th><th class="num">Comprobante</th></tr></thead>'
    +'<tbody>'+(filas||'<tr><td colspan="4" style="color:#6b7686">Sin pagos registrados.</td></tr>')+'</tbody></table></div>'
    +'<div class="explica"><b>¿Por qué cada pago figura en "materiales" o "mano de obra"?</b><br>'
    +'Los <b>materiales</b> se pactan en dólares y la <b>mano de obra</b> en pesos. Cada pago se imputa primero a la cuota más antigua pendiente según su tipo; si pagaste materiales en pesos, se convierte al TC de tu pago.</div>'
    +'<div style="margin-top:16px"><button class="btn sec" onclick="estadoPDF()">Descargar estado de cuenta (PDF)</button></div></div>'
    +cuotasCard
    +'<div class="foot">Documento informativo interno de GLPG Ingeniería. El comprobante de pago no reemplaza a la factura fiscal (AFIP).<br>'
    +'Ante cualquier diferencia, comunicate con administración. · Tus datos se muestran de forma privada y solo para vos.<br>'
    +'Datos actualizados al '+(D.generado||"")+'.</div>';
  document.getElementById("loginView").classList.add("hidden");
  const fv=document.getElementById("fichaView"); fv.innerHTML=html; fv.classList.remove("hidden");
  document.getElementById("topRight").innerHTML='<button class="btn sec" onclick="salir()">Salir</button>';
  window.scrollTo(0,0);
}
function marcaHeader(doc){
  var h=15,w=h*LOGO_ISO_ASPECT;
  try{ doc.addImage(LOGO_ISO,"PNG",14,8,w,h); }catch(e){}
  var x=14+w+6;
  doc.setTextColor(18,58,107); doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("GLPG",x,17);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90,100,115);
  doc.text("Obras e Ingeniería · Córdoba",x,23);
  doc.setDrawColor(240,86,30); doc.setLineWidth(0.8); doc.line(14,28,196,28); doc.setLineWidth(0.2);
}
function recibo(i){
  const f=persona.cuentas[cuentaIdx],p=f.pagos[i]; const J=window.jspdf.jsPDF; const doc=new J();
  marcaHeader(doc);
  doc.setTextColor(18,58,107); doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.text("COMPROBANTE DE PAGO",14,42);
  doc.setTextColor(36,48,64); doc.setFont("helvetica","normal"); doc.setFontSize(11);
  var y=54; function L(k,val){doc.setFont("helvetica","bold");doc.text(k,14,y);doc.setFont("helvetica","normal");doc.text(String(val),70,y);y+=9;}
  L("N° comprobante:", f.id+"-"+String(i+1).padStart(3,"0"));
  L("Fecha de pago:", fmtFecha(p.f));
  L("Cliente:", persona.nombre+" ("+f.id+")");
  L("Obra:", f.obra);
  L("Concepto:", (p.n?("Cuota "+p.n):"Pago")+" · "+(p.t==="mat"?"Materiales":"Mano de obra"));
  var montoTxt=p.mon==="USD"?(fmtUSD(p.m)+"  (≈ "+fmtARS(p.ars)+(p.tc?(" · TC "+p.tc):"")+")"):fmtARS(p.m);
  y+=2; doc.setDrawColor(231,233,238); doc.line(14,y,196,y); y+=12;
  doc.setFillColor(244,245,247); doc.roundedRect(14,y-8,182,16,3,3,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(240,86,30);
  doc.text("Monto pagado:",20,y+2); doc.text(montoTxt,190,y+2,{align:"right"});
  y+=26; doc.setTextColor(107,118,134); doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  doc.text("Documento interno de pago emitido por GLPG Ingeniería. No válido como factura fiscal (AFIP).",14,y);
  doc.text("Generado el "+new Date().toLocaleDateString("es-AR")+".",14,y+6);
  doc.save("Recibo_"+f.id+"_"+(i+1)+".pdf");
}
function estadoPDF(){
  const f=persona.cuentas[cuentaIdx]; const J=window.jspdf.jsPDF; const doc=new J(); marcaHeader(doc);
  doc.setTextColor(18,58,107); doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.text("ESTADO DE CUENTA",14,42);
  doc.setTextColor(36,48,64); doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(persona.nombre+" ("+f.id+")",14,51);
  doc.setFontSize(9.5); doc.text(f.obra,14,57);
  var y=68; function L(k,val){doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(k,14,y);doc.setFont("helvetica","normal");doc.text(String(val),80,y);y+=8;}
  L("Total del plan:",fmtARS(f.planARS)); L("Total pagado:",fmtARS(f.pagARS)); L("Saldo:",fmtARS(f.saldoARS));
  if(f.exc>0) L("A tu favor:",fmtARS(f.exc));
  L("TC del día:","$"+TC_DIA.toLocaleString("es-AR"));
  y+=3; doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(18,58,107); doc.text("Detalle de pagos",14,y); y+=8;
  doc.setFontSize(9); doc.setTextColor(36,48,64);
  f.pagos.forEach(function(p){ if(y>275){doc.addPage();y=20;} doc.setFont("helvetica","normal");
    var t=fmtFecha(p.f)+"  ·  "+(p.n?("Cuota "+p.n):"Pago")+" "+(p.t==="mat"?"(Mat.)":"(M.O.)");
    var mt=p.mon==="USD"?(fmtUSD(p.m)+" ≈ "+fmtARS(p.ars)):fmtARS(p.m);
    doc.text(t,14,y); doc.text(mt,196,y,{align:"right"}); y+=6.5; });
  y+=8; if(y>270){doc.addPage();y=20;} doc.setTextColor(107,118,134); doc.setFontSize(8.5);
  doc.text("Documento informativo interno. No reemplaza la factura fiscal (AFIP).",14,y);
  doc.save("EstadoCuenta_"+f.id+".pdf");
}
